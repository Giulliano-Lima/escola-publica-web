<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Infraestrutura PE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .access-container {
      width: 350px;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
    }
    .header-tabs { display: flex; }
    .tab-button {
      flex: 1;
      padding: 15px 0;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      background-color: #e0e0e0;
      color: #555;
      transition: background-color 0.3s, color 0.3s;
    }
    .tab-button.active {
      background-color: #004d99;
      color: white;
    }
    .form-section { padding: 30px; display: none; }
    .form-section.active { display: block; }
    h2 { color: #004d99; margin-bottom: 25px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 15px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover { background-color: #004d99; }
  </style>
</head>
<body>

  <div class="access-container">
    <div class="header-tabs">
      <button class="tab-button active" onclick="showSection('login')">Login</button>
      <button class="tab-button" onclick="showSection('register')">Cadastre-se</button>
    </div>

    <!-- LOGIN -->
    <div id="login" class="form-section active">
      <h2>Acessar</h2>
      <form id="formLogin">
        <input type="email" placeholder="E-mail" required>
        <input type="password" placeholder="Senha" required>
        <button type="button" onclick="validarLogin()">Entrar</button>
      </form>
      <p style="margin-top: 20px;">
        <a href="#" style="color: #0066cc; text-decoration: none;">Esqueci minha senha</a>
      </p>
    </div>

    <!-- CADASTRO -->
    <div id="register" class="form-section">
      <h2>Criar Conta</h2>
      <form id="formulario">
        <input type="text" placeholder="Nome Completo" required>
        <input type="email" placeholder="E-mail Válido" required>
        <input type="password" id="senha" placeholder="Crie uma Senha" required>
        <input type="password" id="confirmarSenha" placeholder="Confirme a Senha" required>
        <button type="button" onclick="validarFormulario()">Cadastrar</button>
      </form>
    </div>
  </div>

  <script>
    // Função do cadastro !!!!!
    function validarFormulario() {
      const form = document.getElementById("formulario");
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;

      if (senha !== confirmarSenha) {
        alert("As senhas não coincidem!");
        return;
      }

      if (form.checkValidity()) {
        alert("Cadastro realizado com sucesso!");
        window.location.href = "index.html"; 
      } else {
        form.reportValidity();
      }
    }

    // Função do login
    function validarLogin() {
      const form = document.getElementById("formLogin");
      if (form.checkValidity()) {
        alert("Login efetuado com sucesso!");
        window.location.href = "index.html"; 
      } else {
        form.reportValidity();
      }
    }

    // Alterna entre login e cadastro
    function showSection(sectionId) {
      document.querySelectorAll('.form-section').forEach(section => {
        section.classList.remove('active');
      });
      document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
      });

      document.getElementById(sectionId).classList.add('active');
      const correspondingButton = document.querySelector(`.tab-button[onclick*="'${sectionId}'"]`);
      if (correspondingButton) correspondingButton.classList.add('active');
    }
  </script>

</body>
</html>
